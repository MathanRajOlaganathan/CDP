
services:
  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:15
    container_name: cdp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: cdp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres

  # -------------------------
  # Redpanda (Kafka-compatible)
  # -------------------------
  kafka:
    image: redpandadata/redpanda:v25.2.12-arm64
    container_name: cdp-kafka
    ports:
      - "9092:9092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:9092

  # -------------------------
  # Schema Registry (with emulation)
  # -------------------------
  # schema-registry:
  #   image: confluentinc/cp-schema-registry:7.6.3
  #   platform: linux/amd64
  #   container_name: cdp-schema-registry
  #   ports:
  #     - "8085:8081"
  #   environment:
  #     SCHEMA_REGISTRY_HOST_NAME: schema-registry
  #     SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
  #   depends_on:
  #     - kafka

  # -------------------------
  # Kafka Connect (Debezium + BigQuery)
  # -------------------------
  kafka-connect:
    image: redpandadata/connect:latest
    container_name: cdp-kafka-connect
    command: >
      run
      --bootstrap-servers kafka:9092
      --group-id connect-cluster
      --rest-address 0.0.0.0:8083
      --config-topic connect-configs
      --offset-topic connect-offsets
      --status-topic connect-status
    ports:
      - "8083:8083"
    depends_on:
      - kafka


  # -------------------------
  # BigQuery Emulator (ARM-native)
  # -------------------------
  bigquery-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    platform: linux/arm64
    container_name: cdp-bigquery-emulator
    command:
      - bash
      - -c
      - |
        gcloud config set project test-project && \
        gcloud emulators bigquery start \
          --host-port=0.0.0.0:9050
    ports:
      - "9050:9050"


  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7
    container_name: cdp-redis
    ports:
      - "6379:6379"

  # -------------------------
  # Kafka UI
  # -------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdp-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      - kafka
      - kafka-connect

volumes:
  postgres-data:
  connect-plugins:
  kafka-data: