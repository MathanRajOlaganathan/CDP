databaseChangeLog:
  - changeSet:
      id: 20240522-01 # Unique Identifier
      author: CDSL-001 # Responsibility tracker
      changes:
        - createTable:
            tableName: customer
            columns:
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_archived
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false