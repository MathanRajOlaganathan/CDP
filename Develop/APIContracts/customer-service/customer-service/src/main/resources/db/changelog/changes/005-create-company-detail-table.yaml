databaseChangeLog:
  - changeSet:
      id: 20240522-05
      author: CDSL-005
      changes:
        - createTable:
            tableName: company_detail
            columns:
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: legal_name
                  type: varchar(255)
              - column:
                  name: registration_number
                  type: varchar(255)
              - column:
                  name: incorporation_date
                  type: date
              - column:
                  name: industry
                  type: varchar(255)
              - column:
                  name: tax_id
                  type: varchar(255)
              - column:
                  name: employee_count
                  type: int
        - addForeignKeyConstraint:
            baseTableName: company_detail
            baseColumnNames: customer_id
            constraintName: fk_company_detail_customer
            referencedTableName: customer
            referencedColumnNames: customer_id